description: 'Sarla Aviation is an Indian advanced air mobility company building electric vertical
  takeoff and landing (eVTOL) aircraft for urban transportation. Its flagship flying taxi, Shunya,
  uses a hybrid-electric propulsion system (seven electric units, dual battery packs, and a sustainable
  aviation fuel tank) to reach up to 250 km/h with a range up to 800 km and 150 km fully electric,
  in cabin configurations spanning 6-seat, 4-seat, cargo, and ambulance variants. Founded by former
  Lilium engineers Rakesh Gaonkar and Adrian Schmidt, the company is a portfolio company of Accel.
  The public website exposes no developer, API, or technical integration surface as of this enrichment
  pass; this profile captures corporate identity, legal, and domain-security signals only.'
